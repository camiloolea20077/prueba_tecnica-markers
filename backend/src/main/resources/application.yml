server:
  port: 8080

spring:
  application:
    name: data_credits
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/data_credits_db}
    username: ${DB_USER:data_credits}
    password: ${DB_PASSWORD:data_credits}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Bogota
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml

security:
  jwt:
    secret: ${JWT_SECRET:cHJ1ZWJhLXRlY25pY2EtbWFya2Vycy1wcmVzdGFtb3MtYmFuY2FyaW9zLWp3dC1zZWNyZXQtMjU2}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

data-credits:
  amount:
    min: 1000000
    max: 200000000
  term:
    min-months: 6
    max-months: 84
  max-pending-per-user: 3
  rates:
    min-annual: 10.0
    max-annual: 28.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches

logging:
  level:
    # Muestra cuándo la caché no tiene el dato y se consulta la base de datos
    com.markers.data_credits.infrastructure.adapter.out.cache: DEBUG
