<p-toast
  position="top-right"
  styleClass="app-toast"
  [life]="defaultLife"
  [breakpoints]="{ '640px': { width: 'calc(100vw - 2rem)', right: '1rem', left: '1rem' } }"
>
  <ng-template let-message let-closeFn="closeFn" #headless>
    <div
      class="group relative w-full overflow-hidden rounded-2xl bg-surface-950 text-white shadow-2xl shadow-black/25 ring-1 ring-white/10"
      [attr.role]="message.severity === 'error' ? 'alert' : 'status'"
    >
      <div class="flex items-start gap-3 p-4 pr-3">
        <span
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full ring-1"
          [class]="style(message).iconClass"
          aria-hidden="true"
        >
          <i [class]="style(message).icon + ' text-sm font-bold'"></i>
        </span>

        <div class="min-w-0 flex-1 pt-0.5">
          <p class="text-sm font-semibold leading-5">
            {{ message.summary || style(message).label }}
          </p>
          @if (message.detail) {
            <p class="mt-0.5 text-sm leading-5 text-surface-400">{{ message.detail }}</p>
          }
        </div>

        <button
          type="button"
          class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg text-surface-500 transition hover:bg-white/10 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/40"
          (click)="closeFn($event)"
          aria-label="Cerrar notificación"
        >
          <i class="pi pi-times text-xs"></i>
        </button>
      </div>

      @if (!message.sticky) {
        <div class="absolute inset-x-0 bottom-0 h-0.5 bg-white/10">
          <div
            class="toast-progress h-full origin-left bg-white/60 group-hover:[animation-play-state:paused]"
            [style.animation-duration.ms]="message.life ?? defaultLife"
          ></div>
        </div>
      }
    </div>
  </ng-template>
</p-toast>
