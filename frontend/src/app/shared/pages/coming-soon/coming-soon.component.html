<div class="flex min-h-[60vh] items-center justify-center">
  <div
    class="max-w-md rounded-3xl border border-dashed border-surface-300 bg-surface-0 px-8 py-12 text-center"
  >
    <span
      class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-surface-100 text-surface-900"
    >
      <i [class]="(icon() ?? 'pi pi-cog') + ' text-2xl'"></i>
    </span>
    <h2 class="mt-6 text-xl font-semibold text-surface-900">{{ label() }}</h2>
    <p class="mt-2 text-sm text-surface-500">
      Esta sección está en construcción y estará disponible muy pronto.
    </p>
    <p-button
      label="Volver al inicio"
      icon="pi pi-home"
      [outlined]="true"
      styleClass="mt-6"
      routerLink="/inicio"
    />
  </div>
</div>
