# Todo el sistema:            docker compose up -d --build
#   Front  → http://localhost:4200
#   API    → http://localhost:8080/api
#   Postgres (host) → localhost:5433
# Solo la base de datos (desarrollo local con mvn / ng serve):
#                              docker compose up -d postgres

services:
  postgres:
    image: postgres:16-alpine
    container_name: data-credits-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: data_credits_db
      POSTGRES_USER: data_credits
      POSTGRES_PASSWORD: data_credits
      TZ: America/Bogota
    ports:
      - "5433:5432"
    volumes:
      - data-credits-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_credits -d data_credits_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: data-credits-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/data_credits_db
      DB_USER: data_credits
      DB_PASSWORD: data_credits
      CORS_ORIGINS: http://localhost:4200
      TZ: America/Bogota
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: data-credits-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"

volumes:
  data-credits-pgdata:
